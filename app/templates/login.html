<!-- file name: login.html -->
{% extends "base.html" %}

{% block body %}
<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-gray-100 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 transition-colors duration-200">
    <div class="max-w-md w-full">
        <!-- Карточка логина -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 transition-all duration-300 hover:shadow-xl">
            <!-- Заголовок -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-r from-primary-500 to-dark-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-brain text-white text-2xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white">
                    AI Call Analyzer
                </h2>
                <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                    Анализ телефонных звонков с искусственным интеллектом
                </p>
            </div>

            <!-- Сообщение об ошибке -->
            {% if error %}
            <div class="mb-6 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 px-4 py-3 rounded-lg flex items-center">
                <i class="fas fa-exclamation-circle mr-3"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Форма -->
            <form class="space-y-6" id="loginForm">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            <i class="fas fa-user mr-2"></i>Логин
                        </label>
                        <input id="username" name="username" type="text" required
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 dark:focus:ring-dark-500 focus:border-transparent transition-all duration-200"
                               placeholder="Введите логин">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            <i class="fas fa-lock mr-2"></i>Пароль
                        </label>
                        <input id="password" name="password" type="password" required
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 dark:focus:ring-dark-500 focus:border-transparent transition-all duration-200"
                               placeholder="Введите пароль">
                    </div>
                </div>

                <div>
                    <button type="submit"
                            class="w-full py-3 px-4 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 dark:from-dark-500 dark:to-dark-600 dark:hover:from-dark-600 dark:hover:to-dark-700 text-white font-medium rounded-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200">
                        <i class="fas fa-sign-in-alt mr-2"></i>Войти
                    </button>
                </div>

                <!-- Переключение темы -->
                <div class="text-center pt-4 border-t border-gray-200 dark:border-gray-700">
                    <button type="button" onclick="toggleTheme()"
                            class="inline-flex items-center text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 transition-colors duration-200">
                        <i class="fas fa-moon mr-2"></i>Сменить тему
                    </button>
                </div>
            </form>
        </div>

        <!-- Футер -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-500 dark:text-gray-400">
                © 2024 AI Call Analyzer. Все права защищены.
            </p>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const button = this.querySelector('button[type="submit"]');
    const originalText = button.innerHTML;
    button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Вход...';
    button.disabled = true;

    const data = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
    };

    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
            credentials: 'include'
        });

        if (response.ok) {
            window.location.href = '/';
        } else {
            const result = await response.json();
            alert(result.detail || 'Ошибка авторизации');
        }
    } catch (error) {
        alert('Ошибка соединения');
    } finally {
        button.innerHTML = originalText;
        button.disabled = false;
    }
});
</script>
{% endblock %}
