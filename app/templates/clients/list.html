<!-- file name: clients/list.html -->
{% extends "layout.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Заголовок и статистика -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Клиенты</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">
                Всего клиентов: <span id="total-clients">0</span>,
                с звонками: <span id="clients-with-calls">0</span>
            </p>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Кнопка обновления -->
            <button onclick="loadClients()"
                    class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors duration-200">
                <i class="fas fa-sync-alt text-gray-600 dark:text-gray-400"></i>
            </button>
        </div>
    </div>

    <!-- Фильтры -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-4">
        <div class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Поиск -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        Поиск
                    </label>
                    <input type="text" id="search-input"
                           class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 dark:focus:ring-dark-500 focus:border-transparent"
                           placeholder="ФИО, ИНН, Bitrix ID...">
                </div>

                <!-- ИНН -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        ИНН
                    </label>
                    <input type="text" id="inn-input"
                           class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 dark:focus:ring-dark-500 focus:border-transparent"
                           placeholder="Введите ИНН">
                </div>

                <!-- Bitrix ID -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        Bitrix ID
                    </label>
                    <input type="text" id="bitrix-input"
                           class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 dark:focus:ring-dark-500 focus:border-transparent"
                           placeholder="Введите Bitrix ID">
                </div>

                <!-- Воронка -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        Воронка
                    </label>
                    <input type="text" id="funnel-input" list="funnel-options"
                           class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 dark:focus:ring-dark-500 focus:border-transparent"
                           placeholder="Выберите воронку">
                    <datalist id="funnel-options">
                        {% for funnel in funnels %}
                        <option value="{{ funnel }}">
                        {% endfor %}
                    </datalist>
                </div>
            </div>

            <!-- Вторая строка фильтров -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

                <!-- Количество на странице -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        На странице
                    </label>
                    <select id="page-size-select" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 dark:focus:ring-dark-500 focus:border-transparent">
                        <option value="10">10</option>
                        <option value="25" selected>25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>

                <!-- Кнопки фильтров -->
                <div class="flex items-end space-x-2">
                    <button type="button" onclick="resetFilters()"
                            class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">
                        Сбросить
                    </button>
                    <button type="button" onclick="loadClients()"
                            class="px-4 py-2 bg-primary-500 dark:bg-dark-500 hover:bg-primary-600 dark:hover:bg-dark-600 text-white rounded-lg font-medium transition-colors duration-200">
                        Применить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Загрузчик -->
    <div id="loader" class="text-center py-8">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-500 mx-auto"></div>
        <p class="mt-4 text-gray-600 dark:text-gray-400">Загрузка данных...</p>
    </div>

    <!-- Таблица клиентов -->
    <div id="clients-table" class="bg-white dark:bg-gray-800 rounded-xl shadow overflow-hidden hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                <thead class="bg-gray-50 dark:bg-gray-700">
                    <tr>
                        <th class="w-[260px] px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600" onclick="toggleSort('full_name')">
                            Клиент <span id="sort-full_name" class="ml-1"></span>
                        </th>
                        <th class="w-[140px] px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600" onclick="toggleSort('inn')">
                            ИНН <span id="sort-inn" class="ml-1"></span>
                        </th>
                        <th class="w-[160px] px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                            Воронка
                        </th>
                        <th class="w-[120px] px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600" onclick="toggleSort('call_count')">
                            Звонки <span id="sort-call_count" class="ml-1"></span>
                        </th>
                        <th class="w-[180px] px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600" onclick="toggleSort('avg_score')">
                            Оценка <span id="sort-avg_score" class="ml-1"></span>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600" onclick="toggleSort('created_at')">
                            Создан <span id="sort-created_at" class="ml-1"></span>
                        </th>
                        <th class="w-[120px] px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                            Действия
                        </th>
                    </tr>
                </thead>
                <tbody id="clients-body" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                    <!-- Данные будут загружены через JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Сообщение об отсутствии данных -->
    <div id="no-data" class="hidden text-center py-12 bg-white dark:bg-gray-800 rounded-xl shadow">
        <i class="fas fa-user-slash text-4xl mb-4 opacity-50 text-gray-400"></i>
        <p class="text-lg text-gray-600 dark:text-gray-400">Клиенты не найдены</p>
        <p class="text-sm mt-2 text-gray-500 dark:text-gray-500">Попробуйте изменить фильтры поиска</p>
    </div>

    <!-- Пагинация -->
    <div id="pagination" class="hidden flex items-center justify-between bg-white dark:bg-gray-800 rounded-xl shadow p-4">
        <div class="text-sm text-gray-500 dark:text-gray-400">
            Показано <span id="shown-from">0</span> - <span id="shown-to">0</span> из <span id="shown-total">0</span>
        </div>
        <div class="flex space-x-1" id="pagination-buttons">
            <!-- Кнопки пагинации будут сгенерированы динамически -->
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let totalPages = 1;
let totalClients = 0;
let pageSize = 25;
let sortField = 'full_name';
let sortDirection = 'asc';
let clientsWithCalls = 0;

// Иконки для сортировки
const sortIcons = {
    'asc': '↑',
    'desc': '↓',
    'none': ''
};

// Функция загрузки данных
async function loadClients(page = 1) {
    currentPage = page;

    // Показываем загрузчик
    document.getElementById('loader').classList.remove('hidden');
    document.getElementById('clients-table').classList.add('hidden');
    document.getElementById('no-data').classList.add('hidden');
    document.getElementById('pagination').classList.add('hidden');

    // Собираем параметры фильтрации
    const params = new URLSearchParams({
        page: currentPage,
        size: pageSize,
        sort_field: sortField,
        sort_direction: sortDirection,
    });

    // Добавляем фильтры
    const search = document.getElementById('search-input').value;
    const inn = document.getElementById('inn-input').value;
    const bitrixId = document.getElementById('bitrix-input').value;
    const funnel = document.getElementById('funnel-input').value;

    if (search) params.append('search', search);
    if (inn) params.append('inn', inn);
    if (bitrixId) params.append('bitrix_id', bitrixId);
    if (funnel) params.append('funnel', funnel);



    try {
        const response = await fetch(`/clients/list?${params.toString()}`);
        if (!response.ok) throw new Error('Ошибка загрузки данных');

        const data = await response.json();

        // Обновляем счетчики
        totalClients = data.total;
        totalPages = data.pages || 1;

        // Подсчитываем клиентов с звонками
        clientsWithCalls = data.items.filter(client => client.call_count > 0).length;

        document.getElementById('total-clients').textContent = totalClients;
        document.getElementById('clients-with-calls').textContent = clientsWithCalls;

        // Обновляем таблицу
        updateTable(data.items);

        // Обновляем пагинацию
        updatePagination();

        // Обновляем иконки сортировки
        updateSortIcons();

        // Показываем/скрываем элементы
        document.getElementById('loader').classList.add('hidden');

        if (data.items.length === 0) {
            document.getElementById('no-data').classList.remove('hidden');
        } else {
            document.getElementById('clients-table').classList.remove('hidden');
            document.getElementById('pagination').classList.remove('hidden');
        }

    } catch (error) {
        console.error('Error loading clients:', error);
        document.getElementById('loader').classList.add('hidden');
        alert('Ошибка загрузки данных');
    }
}

// Функция обновления таблицы
function updateTable(clients) {
    const tbody = document.getElementById('clients-body');
    tbody.innerHTML = '';

    if (clients.length === 0) {
        return;
    }

    clients.forEach(client => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-150';
        row.onclick = () => {
            window.location.href = `/pages/clients/${client.id}`;
        };
        row.classList.add('cursor-pointer');

        // Форматируем дату
        let dateStr = '—';
        if (client.created_at) {
            const date = new Date(client.created_at);
            dateStr = `${date.getDate().toString().padStart(2, '0')}.${(date.getMonth() + 1).toString().padStart(2, '0')}.${date.getFullYear()}`;
        }

        // Форматируем оценку
        let scoreHtml = '<span class="text-gray-400 dark:text-gray-500">—</span>';
        if (client.avg_score !== null) {
            const score = parseFloat(client.avg_score);
            const scoreColor = score >= 8 ? 'green' : score >= 5 ? 'yellow' : 'red';
            const scoreText = score.toFixed(1);
            const scorePercent = (score / 10) * 100;

            scoreHtml = `
                <div class="flex items-center">
                    <div class="w-16 bg-gray-200 dark:bg-gray-700 rounded-full h-2 mr-2">
                        <div class="h-2 rounded-full bg-${scoreColor}-500"
                             style="width: ${scorePercent}%">
                        </div>
                    </div>
                    <span class="text-sm font-medium text-${scoreColor}-600 dark:text-${scoreColor}-400">
                        ${scoreText}
                    </span>
                </div>
            `;
        }

        // Инициалы для аватарки
        const initials = client.full_name ? client.full_name[0].toUpperCase() : '?';

        row.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap">
                <div class="flex items-center">
                    <div class="flex-shrink-0 w-10 h-10 bg-primary-100 dark:bg-dark-900 rounded-full flex items-center justify-center text-primary-600 dark:text-dark-400 font-semibold">
                        ${initials}
                    </div>
                    <div class="ml-4">
                        <div class="truncate max-w-[220px] text-sm font-medium text-gray-900 dark:text-white">
                            ${client.full_name || 'Без имени'}
                        </div>
                        <div class="text-sm text-gray-500 dark:text-gray-400">
                            ${client.bitrix_id || 'Без Bitrix ID'}
                        </div>
                    </div>
                </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-white">
                ${client.inn || '—'}
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
                ${client.funnel ? `<span class="px-2 py-1 text-xs font-medium rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">${client.funnel}</span>` : '<span class="text-gray-400 dark:text-gray-500">—</span>'}
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm text-gray-900 dark:text-white">
                    ${client.call_count || 0}
                </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
                ${scoreHtml}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-white">
                ${dateStr}
            </td>
            {% if user.is_admin %}
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">

                <button onclick="event.stopPropagation(); deleteClient(${client.id})"                        class="text-red-600 dark:text-red-400 hover:text-red-900 dark:hover:text-red-300">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
            {% endif %}
        `;

        tbody.appendChild(row);
    });

    // Обновляем счетчики показанных элементов
    const from = Math.min((currentPage - 1) * pageSize + 1, totalClients);
    const to = Math.min(currentPage * pageSize, totalClients);

    document.getElementById('shown-from').textContent = from;
    document.getElementById('shown-to').textContent = to;
    document.getElementById('shown-total').textContent = totalClients;
}

// Функция обновления пагинации
function updatePagination() {
    const container = document.getElementById('pagination-buttons');
    container.innerHTML = '';

    if (currentPage > 1) {
        const prevBtn = document.createElement('a');
        prevBtn.href = '#';
        prevBtn.onclick = (e) => { e.preventDefault(); loadClients(currentPage - 1); };
        prevBtn.className = 'px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300';
        prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
        container.appendChild(prevBtn);
    }

    // Вычисляем диапазон страниц для показа
    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);

    for (let p = startPage; p <= endPage; p++) {
        const pageBtn = document.createElement('a');
        pageBtn.href = '#';
        pageBtn.onclick = (e) => { e.preventDefault(); loadClients(p); };
        pageBtn.className = `px-3 py-2 rounded-lg ${p === currentPage ? 'bg-primary-500 dark:bg-dark-500 text-white' : 'bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300'}`;
        pageBtn.textContent = p;
        container.appendChild(pageBtn);
    }

    if (currentPage < totalPages) {
        const nextBtn = document.createElement('a');
        nextBtn.href = '#';
        nextBtn.onclick = (e) => { e.preventDefault(); loadClients(currentPage + 1); };
        nextBtn.className = 'px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300';
        nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
        container.appendChild(nextBtn);
    }
}

// Функция обновления иконок сортировки
function updateSortIcons() {
    // Сбрасываем все иконки
    document.querySelectorAll('[id^="sort-"]').forEach(el => {
        el.textContent = '';
    });

    // Устанавливаем иконку для активного поля
    const sortIcon = document.getElementById(`sort-${sortField}`);
    if (sortIcon) {
        sortIcon.textContent = sortIcons[sortDirection];
    }
}

// Функция переключения сортировки
function toggleSort(field) {
    if (sortField === field) {
        // Переключаем направление
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
    } else {
        // Устанавливаем новое поле и направление по умолчанию
        sortField = field;
        sortDirection = 'asc';
    }


    // Загружаем данные с новой сортировкой
    loadClients(1);
}

// Функция сброса фильтров
function resetFilters() {
    document.getElementById('search-input').value = '';
    document.getElementById('inn-input').value = '';
    document.getElementById('bitrix-input').value = '';
    document.getElementById('funnel-input').value = '';
    document.getElementById('sort-direction').value = 'asc';
    document.getElementById('page-size-select').value = '25';

    sortField = 'full_name';
    sortDirection = 'asc';
    pageSize = 25;

    loadClients(1);
}

// Функция удаления клиента
async function deleteClient(clientId) {
    if (!confirm('Удалить этого клиента?')) return;

    try {
        const response = await fetch(`/clients/${clientId}`, {
            method: 'DELETE',
            credentials: 'include'
        });

        if (response.ok) {
            loadClients(currentPage);
        } else {
            alert('Ошибка при удалении');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Ошибка соединения');
    }
}

// Инициализация
document.addEventListener('DOMContentLoaded', function() {
    // Обработчики событий для динамической фильтрации
    document.getElementById('page-size-select').addEventListener('change', function() {
        pageSize = parseInt(this.value);
        loadClients(1);
    });


    // Поиск при нажатии Enter
    ['search-input', 'inn-input', 'bitrix-input', 'funnel-input'].forEach(id => {
        document.getElementById(id).addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadClients(1);
            }
        });
    });

    // Загружаем данные при загрузке страницы
    loadClients(1);
});
</script>
{% endblock %}
