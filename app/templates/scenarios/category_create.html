<!-- file name: scenarios/category_create.html -->
{% extends "layout.html" %}

{% block title %}Добавить критерий к {{ scenario.name }}{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/pages/scenarios/{{ scenario.id }}" class="text-primary-600 dark:text-dark-500 hover:text-primary-800 dark:hover:text-dark-400 transition-colors mb-4 inline-block">
        <i class="fas fa-arrow-left mr-2"></i> Назад к сценарию
    </a>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Добавить критерий</h1>
    <p class="text-gray-600 dark:text-gray-400 mt-1">Сценарий: {{ scenario.name }}</p>
</div>

<div class="bg-white dark:bg-gray-800 shadow rounded-lg p-6 max-w-2xl mx-auto transition-colors">
    <form id="categoryForm" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                Название критерия *
            </label>
            <input type="text" id="title" name="title" required
                   class="w-full border border-gray-300 dark:border-gray-600 rounded-md px-3 py-2 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100"
                   placeholder="Например: Приветствие, Выявление потребностей">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                Описание критерия
            </label>
            <textarea id="description" name="description" rows="3"
                      class="w-full border border-gray-300 dark:border-gray-600 rounded-md px-3 py-2 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100"
                      placeholder="Подробное описание того, что оценивается в этом критерии"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                    Вес (0-100) *
                </label>
                <input type="number" id="weight" name="weight" required min="0" max="100" value="10"
                       class="w-full border border-gray-300 dark:border-gray-600 rounded-md px-3 py-2 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Влияние критерия на общую оценку</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                    Порядок сортировки
                </label>
                <input type="number" id="sort_order" name="sort_order" value="0"
                       class="w-full border border-gray-300 dark:border-gray-600 rounded-md px-3 py-2 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="is_active" name="is_active" checked
                       class="h-4 w-4 text-primary-600 dark:text-dark-500 focus:ring-primary-500 dark:focus:ring-dark-500 border-gray-300 dark:border-gray-600 rounded">
                <label for="is_active" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Активен</label>
            </div>
        </div>

        <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200 dark:border-gray-700">
            <a href="/pages/scenarios/{{ scenario.id }}" class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-4 py-2 rounded-md text-sm hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                Отмена
            </a>
            <button type="submit"
                    class="bg-primary-600 dark:bg-dark-600 text-white px-4 py-2 rounded-md text-sm hover:bg-primary-700 dark:hover:bg-dark-700 transition-colors">
                Создать критерий
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('categoryForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const data = {
        title: formData.get('title'),
        description: formData.get('description') || null,
        weight: parseInt(formData.get('weight')) || 0,
        sort_order: parseInt(formData.get('sort_order')) || 0,
        is_active: formData.get('is_active') === 'on'
    };

    try {
        const response = await fetch('/scenarios/{{ scenario.id }}/categories', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
            credentials: 'include'
        });

        if (response.ok) {
            window.location.href = '/pages/scenarios/{{ scenario.id }}';
        } else {
            const result = await response.json();
            alert(result.detail || 'Ошибка при создании критерия');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Ошибка соединения');
    }
});
</script>
{% endblock %}
